version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      runtime-routine:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-routine:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
